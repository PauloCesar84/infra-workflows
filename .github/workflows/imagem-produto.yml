# Fabrica de imagem REUTILIZAVEL do pool (k3s) - versao v2.
#
# v2 (2026-10-30): publica no REGISTRY DO POOL (registry.pauloleitte.com.br), privado, com a
# credencial do robot passada pelo produto como segredo. A v1 publicava no ghcr.io com o
# GITHUB_TOKEN; ela continua existindo para quem ja aponta para la - a tag v1 nao se move.
#
# CHAMADA (no repositorio do produto):
#   jobs:
#     imagem:
#       uses: PauloCesar84/infra-workflows/.github/workflows/imagem-produto.yml@v2
#       with:
#         imagem: registry.pauloleitte.com.br/<produto>
#       secrets:
#         registry_username: ${{ secrets.REGISTRY_USER }}
#         registry_password: ${{ secrets.REGISTRY_PASSWORD }}
#
# A tag da imagem e o SHA do commit. NUNCA se publica `latest`: cada versao no ar aponta para um commit.
name: imagem-produto

on:
  workflow_call:
    inputs:
      imagem:
        description: "Endereco no registry, sem tag (ex.: registry.pauloleitte.com.br/kisaber-site)"
        required: true
        type: string
      registry:
        description: "Host do registry, sem https"
        required: false
        type: string
        default: "registry.pauloleitte.com.br"
      contexto:
        description: "Diretorio de contexto do build"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      plataformas:
        description: "Plataformas alvo (os nos do pool sao linux/amd64)"
        required: false
        type: string
        default: "linux/amd64"
    secrets:
      registry_username:
        description: "Usuario do registry (conta robot)"
        required: true
      registry_password:
        description: "Senha do registry (conta robot)"
        required: true

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do commit
        uses: actions/checkout@v4

      - name: Preparar o construtor (buildx)
        uses: docker/setup-buildx-action@v3

      - name: Entrar no registry do pool
        # Credencial vem do produto (segredos do repositorio). Nao e token pessoal nem token de plataforma:
        # e a conta robot do registry, que e nossa.
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Construir e empurrar (tag = SHA do commit)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.contexto }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.plataformas }}
          push: true
          tags: |
            ${{ inputs.imagem }}:${{ github.sha }}
            ${{ inputs.imagem }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
