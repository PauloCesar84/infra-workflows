# Fabrica de imagem REUTILIZAVEL do pool (k3s) - versao v3.
#
# v2 (2026-10-30): publica no REGISTRY DO POOL (registry.pauloleitte.com.br), privado, com a
# credencial do robot passada pelo produto como segredo.
# v3 (2026-10-30): FECHA O CICLO. Se o produto informar `manifesto`, a fabrica commita o SHA novo
# no manifesto - e ai o Argo aplica sozinho. Sem esse passo, publicar imagem nao muda o site (era a
# "cola" manual). A v2 continua existindo para quem nao quer esse commit automatico - nada se move.
#
# CHAMADA (no repositorio do produto):
#   permissions:
#     contents: write        # a v3 precisa disto para commitar o manifesto
#   jobs:
#     imagem:
#       uses: PauloCesar84/infra-workflows/.github/workflows/imagem-produto.yml@v3
#       with:
#         imagem: registry.pauloleitte.com.br/<produto>
#         manifesto: deploy/deployment.yaml    # caminho no MESMO repositorio; vazio = nao commita
#       secrets:
#         registry_username: ${{ secrets.REGISTRY_USER }}
#         registry_password: ${{ secrets.REGISTRY_PASSWORD }}
#
# A tag da imagem e o SHA do commit. NUNCA se publica `latest`: cada versao no ar aponta para um commit.
name: imagem-produto

on:
  workflow_call:
    inputs:
      imagem:
        description: "Endereco no registry, sem tag (ex.: registry.pauloleitte.com.br/kisaber-site)"
        required: true
        type: string
      registry:
        description: "Host do registry, sem https"
        required: false
        type: string
        default: "registry.pauloleitte.com.br"
      contexto:
        description: "Diretorio de contexto do build"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      plataformas:
        description: "Plataformas alvo (os nos do pool sao linux/amd64)"
        required: false
        type: string
        default: "linux/amd64"
      manifesto:
        description: "Manifesto (no MESMO repositorio) que aponta a imagem; vazio = nao commita"
        required: false
        type: string
        default: ""
    secrets:
      registry_username:
        description: "Usuario do registry (conta robot)"
        required: true
      registry_password:
        description: "Senha do registry (conta robot)"
        required: true

permissions:
  # write por causa da cola (commitar o SHA novo no manifesto). Sem `manifesto`, o write nao e usado.
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do commit
        uses: actions/checkout@v4

      - name: Preparar o construtor (buildx)
        uses: docker/setup-buildx-action@v3

      - name: Entrar no registry do pool
        # Credencial vem do produto (segredos do repositorio). Nao e token pessoal nem token de plataforma:
        # e a conta robot do registry, que e nossa.
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Construir e empurrar (tag = SHA do commit)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.contexto }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.plataformas }}
          push: true
          tags: |
            ${{ inputs.imagem }}:${{ github.sha }}
            ${{ inputs.imagem }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar a imagem nova no manifesto (a cola do GitOps)
        # Sem este passo, publicar imagem NAO muda o site: e exatamente o pedaco que o Argo, sozinho,
        # nao faz. Com ele, um `push` no GitOps fica completo: constroi, publica e aponta - o Argo
        # aplica em seguida (~3 min, ou instantaneo com webhook).
        if: ${{ inputs.manifesto != '' }}
        shell: bash
        run: |
          set -euo pipefail
          alvo="${{ inputs.manifesto }}"
          if [ ! -f "$alvo" ]; then
            echo "::error::manifesto '$alvo' nao existe neste repositorio"
            exit 1
          fi
          git config user.name  "fabrica-de-imagem"
          git config user.email "fabrica-de-imagem@users.noreply.github.com"
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*)${{ inputs.imagem }}:[^[:space:]]*#\1${{ inputs.imagem }}:${{ github.sha }}#" "$alvo"
          if git diff --quiet -- "$alvo"; then
            echo "O manifesto ja apontava para este commit - nada a fazer."
            exit 0
          fi
          git add "$alvo"
          # [skip ci] impede que este commit dispare a fabrica de novo (nada de laco infinito).
          git commit -m "manifesto: no ar aponta para a imagem do commit ${{ github.sha }} [skip ci]"
          git push || { git pull --rebase --autostash && git push; }
          echo "Manifesto apontado para ${{ github.sha }} - o Argo aplica agora."
