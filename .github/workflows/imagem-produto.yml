# Fabrica de imagem REUTILIZAVEL do pool (k3s).
#
# Vive aqui (repositorio central) e e CHAMADA por cada produto, que fica com um chamador de ~6 linhas:
#
#   jobs:
#     imagem:
#       uses: PauloCesar84/infra-workflows/.github/workflows/imagem-produto.yml@v1
#       with:
#         imagem: ghcr.io/paulocesar84/<produto>
#
# O que ela faz: constroi a imagem DO COMMIT e publica com a tag sendo o SHA. NUNCA publica `latest`:
# cada versao no ar tem de apontar para um commit - tag movel quebra o rollback por commit.
#
# Versao: v1 (2026-10-30). Ao mudar este arquivo, crie v2 em vez de mover a v1 - quem chama fixa a
# versao, e mover a tag troca o build de quem ja estava funcionando.
name: imagem-produto

on:
  workflow_call:
    inputs:
      imagem:
        description: "Endereco no registry, sem tag (ex.: ghcr.io/paulocesar84/kisaber-site)"
        required: true
        type: string
      contexto:
        description: "Diretorio de contexto do build"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      plataformas:
        description: "Plataformas alvo (os nos do pool sao linux/amd64)"
        required: false
        type: string
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do commit
        uses: actions/checkout@v4

      - name: Preparar o construtor (buildx)
        uses: docker/setup-buildx-action@v3

      - name: Entrar no registry com o token da propria execucao
        # Nao usa token pessoal parado: o GITHUB_TOKEN nasce e morre com a execucao.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e empurrar (tag = SHA do commit)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.contexto }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.plataformas }}
          push: true
          tags: |
            ${{ inputs.imagem }}:${{ github.sha }}
            ${{ inputs.imagem }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
